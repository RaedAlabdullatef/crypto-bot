name: Run Crypto Trading Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # <--- Das behebt den Exit Code 128 / Berechtigungsfehler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt pandas

      - name: Run bot script
        run: |
          python bot.py

      - name: Commit and push changes (Save logs)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add bot_trading_log.csv
          git commit -m "Auto-update bot trading log" || exit 0
          git push
