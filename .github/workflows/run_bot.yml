name: Run Crypto Trading Bot

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC يومياً (بعد إغلاق الشمعة اليومية)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install ccxt pandas

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit and push logs automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update bot trading log"
          file_pattern: bot_trading_log.csv bot_state.json
